[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beanie-mind"
version = "0.1.0"
description = "Beanie — an artificial mind, not an agent. Stage 0 skeleton."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[project.scripts]
beanie = "beanie.cli:main_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
